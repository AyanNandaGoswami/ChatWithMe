{% extends 'base/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'resources/css/recent_chats.css' %}" />
{% endblock %}

{% block content %}
  <!-- Search Bar Section -->
  <section class="intro-search">
    <form class="search-form" method="POST" action="/search/">
      {% csrf_token %}
      <input class="search-input" type="search" name="query" placeholder="Search contacts" required />
      <button class="search-btn" type="submit"><i class="fas fa-search"></i></button>
    </form>
  </section>

  <!-- Main content -->
  <main class="profile-container">
    <div class="contact-list-container" id="list-container-id"></div>
  </main>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'resources/js/profile.js' %}"></script>
{% endblock %}
