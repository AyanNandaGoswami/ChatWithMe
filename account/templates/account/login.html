{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'resources/css/login.css' %}">
</head>
<body>
  <div class="login-container">
    <h2>Login here</h2>
    <div class="form-floating col-md-12 mb-3">
      <input type="email" class="form-control" id="email" placeholder="Email" required>
      <label id="email_label" for="email">Email <span style="color: red">*</span></label>
      <div class="invalid-feedback" id="email_err_id"></div>
    </div>

    <div class="form-floating col-md-12 mb-3">
      <input type="password" class="form-control" id="password" placeholder="Password" required>
      <label for="password" id="password_label">Password <span style="color: red">*</span></label>
      <div class="invalid-feedback" id="password_err_id"></div>
    </div>

    <div class="col-md-12 mb-3">
      <input type="submit" name="login" value="Login" id="login-btn" class="btn btn-primary w-100" />
    </div>

    <a href="." class="link">Forgot Password?</a>
    <p class="mt-2">Don't have an account? <a href="{% url 'register' %}" class="link">Sign up</a></p>
    <p class="error-message" id="error-msg">&nbsp;</p>
  </div>

  <!-- Bootstrap JS + jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="{% static 'resources/js/login.js' %}"></script>
</body>
</html>
