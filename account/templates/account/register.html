{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'resources/css/register.css' %}">
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="register-container">
      <h2>Register here</h2>
      <div class="row gx-3 px-2">
        <div class="form-floating col-md-4 mb-3">
          <input type="text" class="form-control" id="firstname" placeholder="First Name" required>
          <label for="firstname">First Name <span style="color: red">*</span></label>
          <div class="invalid-feedback" id="firstname_err_id"></div>
        </div>

        <div class="form-floating col-md-4 mb-3">
          <input type="text" class="form-control" id="middlename" placeholder="Middle Name">
          <label for="middlename">Middle Name</label>
        </div>

        <div class="form-floating col-md-4 mb-3">
          <input type="text" class="form-control" id="lastname" placeholder="Last Name" required>
          <label for="lastname">Last Name <span style="color: red">*</span></label>
          <div class="invalid-feedback" id="lastname_err_id"></div>
        </div>

        <div class="form-floating col-md-6 mb-3">
          <input type="email" class="form-control" id="email" placeholder="Email" required>
          <label id="email_label" for="email">Email <span style="color: red">*</span></label>
          <div class="invalid-feedback" id="email_err_id"></div>
        </div>

        <div class="form-floating col-md-6 mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <label id="password_label" for="password">Password <span style="color: red">*</span></label>
          <div class="invalid-feedback" id="password_err_id"></div>
        </div>

        <div class="col-md-12 mb-3 text-start">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="isadmin">
            <label class="form-check-label" for="isadmin">
              Is Admin
            </label>
          </div>
        </div>

        <div class="col-md-12">
          <input type="submit" name="register" value="Register" id="reg-btn" class="btn btn-primary w-100" />
        </div>
      </div>

      <p class="mt-3 text-muted">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
      <p class="error-message" id="error-msg">&nbsp;</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="{% static 'resources/js/register.js' %}"></script>
</body>
</html>
